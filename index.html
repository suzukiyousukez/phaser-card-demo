<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Phaser HP Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

<style>
body { margin: 0; }
</style>
</head>

<body>

<script>

let card;
let hp = 100;
let hpBar;

const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 600,
  backgroundColor: "#0f172a",

  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },

  scene: {
    preload,
    create,
    update
  }
};

new Phaser.Game(config);

function preload() {
  this.load.image("card", "card1.jpg");
}

function create() {

  card = this.add.image(400, 300, "card");
  card.setScale(0.4);

  // HPバー背景
  this.add.rectangle(400, 200, 220, 20, 0x333333);

  // HPバー本体（これを毎フレーム更新）
  hpBar = this.add.rectangle(400, 200, 220, 20, 0x22c55e);

}

function update(time, delta) {

  if (hp > 0) {
    hp -= 0.1;  // 毎フレーム減少
  }

  // HPバーの幅を変更
  hpBar.width = 220 * (hp / 100);

  // HPが0になったらカード消える
  if (hp <= 0 && card.visible) {
    card.setVisible(false);
  }

}

</script>

</body>
</html>
