<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Phaser Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

<style>
body {
  margin: 0;
}
</style>
</head>

<body>

<script>

const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 600,
  backgroundColor: "#0f172a",
  scene: {
    preload,
    create
  }
};

const game = new Phaser.Game(config);

function preload() {
  this.load.image("card", "card1.jpg");
}

function create() {

  const card = this.add.image(400, 450, "card");
  card.setScale(0.4);

  card.setInteractive({ draggable: true });

  this.input.setDraggable(card);

  this.input.on("drag", function(pointer, gameObject, dragX, dragY) {
    gameObject.x = dragX;
    gameObject.y = dragY;
  });

}

</script>

</body>
</html>
