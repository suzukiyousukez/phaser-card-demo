<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Phaser Update Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

<style>
body { margin: 0; }
</style>
</head>

<body>

<script>

let card;

const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 600,
  backgroundColor: "#0f172a",

  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },

  scene: {
    preload,
    create,
    update   // ← ここ追加
  }
};

new Phaser.Game(config);

function preload() {
  this.load.image("card", "card1.jpg");
}

function create() {

  card = this.add.image(400, 300, "card");
  card.setScale(0.4);

}

function update(time, delta) {

  // 毎フレーム少しずつ回転
  card.rotation += 0.01;

}

</script>

</body>
</html>
